name: Test · Build · Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Unit + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: veyra-runtime
          path: dist/
          retention-days: 14
  browser:
    name: Desktop · Mobile · Voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  cloudflare:
    name: Cloudflare · workerd · Mobile · Voice
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-results
          path: |
            dist/cloudflare-worker/
            test-results/
            playwright-report/
          retention-days: 7
  container:
    name: Docker → GHCR
    needs: [quality, browser, cloudflare]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/xykal/veyra-neon-district
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test published container
        run: |
          docker run -d --name veyra-smoke -p 127.0.0.1:3102:3000 ghcr.io/xykal/veyra-neon-district@${{ steps.build.outputs.digest }}
          curl --fail --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 5 --retry-max-time 45 http://127.0.0.1:3102/healthz
          docker exec --user node veyra-smoke test -w /app/data
          docker exec veyra-smoke node -e 'const s=require("fs").readFileSync("/proc/1/status","utf8");if(!/^Uid:\s+1000\s/m.test(s))process.exit(1)'
      - name: Container cleanup
        if: always()
        run: |
          docker logs veyra-smoke || true
          docker rm -f veyra-smoke || true
  cloudflare-deploy:
    name: Deploy → Cloudflare
    needs: [quality, browser, cloudflare]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deploy tested Worker and public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy:cloudflare -- --var BUILD_SHA:${{ github.sha }}
      - name: Verify deployed build, assets and WSS
        if: vars.CLOUDFLARE_PUBLIC_URL != ''
        env:
          CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node tools/smoke-cloudflare.mjs
